  <h2>Реєстрація</h2>
  <form>
    <label for="name">Ім'я:</label>
    <input type="text" id="name" name="name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <button type="submit">
      Зареєструватися
    </button>
  </form>

  <!--
Виправлені проблеми:
1. Додано атрибут lang="uk" до тега <html> для правильного визначення мови документа
2. Виправлено заголовки: <h2> замінено на <h1> для головного заголовка, <h4> — на <h2> для підзаголовків
3. Покращено навігацію тегом <nav> з aria-label, посиланням надано зрозумілі тексти ("Уроки", "Контакти" замість "Тут", "Натиснути тут")
4. Поля підписано за допомогою <label> з атрибутами for з <input>, для email використано type="email"; кнопці форми type="submit"
5. До зображення додано атрибути width і height, щоб воно не розтягувалося на всю ширину і краще вписувалося в дизайн сторінки
